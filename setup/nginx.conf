worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  300;
    client_max_body_size 200m;   # 유사제품검색 등 대용량 문서 업로드 대비(50m→200m)

    server {
        listen       80;
        server_name  __SERVER_IP__;

        location /static/ {
            alias __STATIC_ROOT__/;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }
    }

    # HTTPS: http 로 받은 다운로드에 붙는 브라우저의 "보안 연결 아님" 경고를 없애려면 https 로 접속.
    # 인증서(gscert.crt/gscert.key)는 setup/gen_self_signed_cert.ps1 로 conf 폴더에 생성한다.
    # (자체서명이라 클라이언트의 "신뢰할 수 있는 루트 인증 기관"에 gscert.crt 를 등록해야 경고가 완전히 사라진다.)
    server {
        listen       443 ssl;
        server_name  __SERVER_IP__;

        ssl_certificate      gscert.crt;
        ssl_certificate_key  gscert.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        location /static/ {
            alias __STATIC_ROOT__/;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }
    }
}
