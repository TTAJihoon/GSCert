worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  300;
    client_max_body_size 200m;   # 유사제품검색 등 대용량 문서 업로드 대비(50m→200m)

    # HTTP(80): 모든 요청을 HTTPS 로 영구 리다이렉트.
    server {
        listen       80;
        server_name  __SERVER_IP__ __SERVER_DOMAIN__;
        return 301 https://$host$request_uri;
    }

    # HTTPS: http 로 받은 다운로드에 붙는 브라우저의 "보안 연결 아님" 경고를 없애려면 https 로 접속.
    # 인증서(gscert.crt/gscert.key)는 setup/gen_self_signed_cert.ps1 로 conf 폴더에 생성한다.
    # (자체서명이라 클라이언트의 "신뢰할 수 있는 루트 인증 기관"에 gscert.crt 를 등록해야 경고가 완전히 사라진다.)
    server {
        listen       443 ssl;
        server_name  __SERVER_IP__ __SERVER_DOMAIN__;

        ssl_certificate      gscert.crt;
        ssl_certificate_key  gscert.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # ── 도메인/호스트 정책 ────────────────────────────────────────────────
        # 메인 GSCert 앱: IP(__SERVER_IP__)와 도메인(__SERVER_DOMAIN__) 양쪽으로 서비스한다.
        #   Django 의 Host 기반 센터(상암/영남/분당) 라우팅이 도메인에서도 동작하도록
        #   myproject/settings.py 의 SERVER_DOMAIN 환경변수를 반드시 같이 설정해야 한다
        #   (설정 안 하면 도메인 요청은 매핑 miss 로 라우팅/네비홈이 깨진다).
        # 상담(consultation) 앱: 구글 OAuth 가 IP redirect_uri 를 거부하므로 반드시
        #   도메인(__SERVER_DOMAIN__)으로만 서비스한다. IP로 오면 도메인으로 올린다.
        # ▷ 도메인 교체 시: __SERVER_DOMAIN__ 값만 바꾸고(setup.ps1/Update-NginxConf.ps1 의
        #   $env:SERVER_DOMAIN), 인증서 SAN·구글 콘솔 redirect·8787 redirect_uri 를 같은 도메인으로
        #   맞추면 된다. 상세: docs/CONSULTATION_PROXY_SETUP.md

        location /static/ {
            alias __STATIC_ROOT__/;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        # /consultation/ → 8787 상담 앱 리버스 프록시 (주소창은 도메인, 내용은 8787 서버).
        # 8787 앱이 CONSULT_BASE_PREFIX=/consultation 로 접두어를 직접 처리하므로 경로를 그대로 넘긴다.
        # 콜백: https://__SERVER_DOMAIN__/consultation/auth/callback (구글 리다이렉트 방식)
        location /consultation/ {
            # 조건2) IP로 들어온 상담 접속은 도메인으로 올린다(구글 OAuth 도메인 요구 충족).
            # 302(임시)로 두어 향후 도메인 교체 시 브라우저 캐시에 고정되지 않게 한다.
            if ($host = __SERVER_IP__) { return 302 https://__SERVER_DOMAIN__$request_uri; }

            proxy_pass https://210.96.71.67.nip.io:8787;   # 끝에 / 없음(=/consultation 접두어 유지)
            # 사내에서 nip.io DNS가 막히면 위 줄을 아래로 교체:
            #   proxy_pass https://210.96.71.67:8787;
            #   proxy_ssl_name 210.96.71.67.nip.io;
            proxy_http_version 1.1;
            proxy_set_header Host              210.96.71.67.nip.io:8787;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;                      # 업스트림 TLS SNI

            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }

        location / {
            # 메인 앱은 IP/도메인 모두 그대로 통과시킨다(센터 라우팅은 Django 의 SERVER_DOMAIN
            # 설정이 담당 — 위 도메인/호스트 정책 주석 참고).
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }
    }
}
