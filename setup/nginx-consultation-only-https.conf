worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  300;
    client_max_body_size 200m;   # 유사제품검색 등 대용량 문서 업로드 대비(50m→200m)

    # HTTP(80): 메인 앱은 그대로 http로 서비스한다. /consultation/ 만 https(도메인)로 올린다.
    # (구글 OAuth가 IP redirect_uri를 거부하므로 상담 앱은 반드시 도메인+https가 필요하다.)
    server {
        listen       80;
        server_name  __SERVER_IP__ __SERVER_DOMAIN__;

        location /static/ {
            alias __STATIC_ROOT__/;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
        }

        location /consultation/ {
            return 301 https://__SERVER_DOMAIN__$request_uri;
        }

        location / {
            # IP 접속은 공식 도메인으로 전환하고, 이 모드의 메인 앱은 도메인 HTTP로 서비스한다.
            if ($host = __SERVER_IP__) { return 308 http://__SERVER_DOMAIN__$request_uri; }

            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }
    }

    # HTTPS: /consultation/ 전용. 그 외 경로는 http로 되돌려 이 서버 블록 밖에서 처리시킨다.
    # 인증서(gscert.crt/gscert.key)는 setup/gen_self_signed_cert.ps1 로 conf 폴더에 생성한다.
    server {
        listen       443 ssl;
        server_name  __SERVER_IP__ __SERVER_DOMAIN__;

        if ($host = __SERVER_IP__) { return 308 https://__SERVER_DOMAIN__$request_uri; }

        ssl_certificate      gscert.crt;
        ssl_certificate_key  gscert.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # /consultation/ → 8787 상담 앱 리버스 프록시 (주소창은 도메인, 내용은 8787 서버).
        # 8787 앱이 CONSULT_BASE_PREFIX=/consultation 로 접두어를 직접 처리하므로 경로를 그대로 넘긴다.
        # 콜백: https://__SERVER_DOMAIN__/consultation/auth/callback (구글 리다이렉트 방식)
        location /consultation/ {
            # IP로 들어온 상담 접속은 도메인으로 올린다(구글 OAuth 도메인 요구 충족).
            if ($host = __SERVER_IP__) { return 302 https://__SERVER_DOMAIN__$request_uri; }

            proxy_pass https://210.96.71.67.nip.io:8787;   # 끝에 / 없음(=/consultation 접두어 유지)
            # 사내에서 nip.io DNS가 막히면 위 줄을 아래로 교체:
            #   proxy_pass https://210.96.71.67:8787;
            #   proxy_ssl_name 210.96.71.67.nip.io;
            proxy_http_version 1.1;
            proxy_set_header Host              210.96.71.67.nip.io:8787;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_ssl_server_name on;                      # 업스트림 TLS SNI

            proxy_connect_timeout 600s;
            proxy_send_timeout    600s;
            proxy_read_timeout    600s;
        }

        # /consultation/ 외의 다른 경로로 https 요청이 들어오면 http로 되돌린다(이 모드에서는 https 전용이 아니므로).
        location / {
            return 301 http://__SERVER_DOMAIN__$request_uri;
        }
    }
}
